name: CI
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', '.claude/**']
  pull_request:
    paths-ignore: ['**.md', '.claude/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Lint (warnings fail)
        run: npx oxlint --deny-warnings
      - name: Type check (app, vite config, scripts)
        run: npx tsc -b
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Contrast gate (WCAG AA 4.5:1)
        run: npm run contrast
      - name: Balance smoke run
        run: npm run balance -- 1 3
