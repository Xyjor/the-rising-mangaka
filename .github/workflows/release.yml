name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: Build and release (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --no-audit --no-fund
      - name: Version check against the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run version:check -- ${{ github.ref_name }}
      - name: Tests
        run: npm test
      - name: Build (and draft a release on tags)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty on workflow_dispatch (no tag): tauri-action then only builds, it does not create a release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: The Rising Mangaka ${{ github.ref_name }}
          releaseBody: >-
            Windows installer for The Rising Mangaka ${{ github.ref_name }}. Windows SmartScreen may warn about an
            unrecognised app: choose More info, then Run anyway. Installing over an older version keeps your save.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
      - name: Upload installer artifact (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
